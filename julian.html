<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>What Crisis?</title>
  <link rel="stylesheet" href="gallery-config.css?v=3">
  <link rel="stylesheet" href="julian.css?v=5">
  <link rel="stylesheet" href="game3.css?v=7">
  <!-- Tiny Object-circle loops — start the first ring before JS builds portals. -->
  <link rel="preload" as="video" href="video/web/portal/track-one.mp4" type="video/mp4">
  <link rel="preload" as="video" href="video/web/portal/track-two.mp4" type="video/mp4">
  <link rel="preload" as="video" href="video/web/portal/track-three.mp4" type="video/mp4">
  <link rel="preload" as="video" href="video/web/portal/track-four.mp4" type="video/mp4">
  <link rel="preload" as="image" href="assets/web/Gallery.jpg">
</head>
<body>
  <div id="julian-gallery" class="gallery-viewport" hidden>
    <div class="gallery-stage">
      <img
        class="gallery-background"
        src="assets/web/Gallery.jpg"
        alt=""
        width="900"
        height="900"
        decoding="async"
        fetchpriority="high"
      />

      <img
        class="gallery-logo"
        src="assets/game/web/Logo.png"
        alt=""
        draggable="false"
        decoding="async"
      />

      <div class="gallery-portals" id="gallery-portals" aria-label="Object terminals"></div>
    </div>
  </div>

  <div id="julian-artwork" class="julian-artwork" hidden>
    <img id="julian-art-image" alt="">
  </div>

  <div id="crisis-game3" class="crisis-game3" aria-hidden="true" tabindex="0" role="application" onclick="">
    <canvas id="crisis-game3-canvas" class="crisis-game3-canvas"></canvas>
    <button type="button" class="crisis-game3-hit" aria-label="Throw briefcase"></button>
    <div id="crisis-game3-fire" class="crisis-game3-fire" aria-hidden="true"></div>
  </div>

  <script src="site-access.js?v=3"></script>
  <script src="tracks.js?v=5"></script>
  <script src="game3-config.js?v=12"></script>
  <script src="game3.js?v=22"></script>
  <script>
    (function () {
      var art = document.getElementById('julian-artwork');
      var img = document.getElementById('julian-art-image');
      var gallery = document.getElementById('julian-gallery');
      if (!art) return;
      window.__artArmed = 0;
      function enterFromArt(event) {
        if (art.hidden) return;
        if (event) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        if (performance.now() < (window.__artArmed || 0)) return;
        window.location.replace('well.html');
      }
      art.addEventListener('click', enterFromArt, true);
      if (img) img.addEventListener('click', enterFromArt, true);
    })();
  </script>
  <script src="julian.js?v=12"></script>
</body>
</html>
