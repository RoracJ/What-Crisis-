<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Crisis?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portal-config.css">
  <link rel="stylesheet" href="game-config.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="game.css?v=4">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-stage">
      <img
        class="hero-background"
        src="assets/background.png"
        alt=""
        width="759"
        height="1024"
        decoding="async"
        fetchpriority="high"
      />

      <div class="portal-inner" aria-hidden="true">
        <video
          class="portal-video"
          autoplay
          muted
          loop
          playsinline
          preload="auto"
          src="videos/portal.mov"
        ></video>
      </div>

      <button type="button" class="game-trigger" id="open-game" aria-label="Something in the crowd looks back"></button>
      <button type="button" class="portal-open" id="open-player" aria-label="Open music player"></button>
    </div>
  </header>

  <div id="crisis-game" class="crisis-game" aria-hidden="true">
    <canvas id="crisis-canvas" class="crisis-canvas"></canvas>
    <div id="crisis-death-flash" class="crisis-fire" aria-hidden="true"></div>
    <div id="crisis-death-cards" class="crisis-death-cards" aria-hidden="true">
      <img
        class="crisis-death-card crisis-death-card-a"
        src="assets/game/80992891369__BA3DA959-0F0E-4A81-AC6F-A8A56352DB5E.jpg"
        alt=""
        width="2365"
        height="3219"
        draggable="false"
      />
      <img
        class="crisis-death-card crisis-death-card-b"
        src="assets/well-final.jpg"
        alt=""
        width="1258"
        height="950"
        draggable="false"
      />
    </div>
    <p id="crisis-prompt" class="crisis-prompt">Can one truly reach the object of one's desire?</p>
    <div class="crisis-lab" id="crisis-lab">
      <div class="lab-machine">
        <svg class="lab-filters" aria-hidden="true">
          <filter id="lab-logo-grit" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="11" result="noise" />
            <feColorMatrix type="saturate" values="0" in="noise" result="grain" />
            <feComponentTransfer in="grain" result="grainSoft">
              <feFuncA type="linear" slope="0.32" />
            </feComponentTransfer>
            <feBlend in="SourceGraphic" in2="grainSoft" mode="multiply" result="gritty" />
            <feComponentTransfer in="gritty">
              <feFuncR type="linear" slope="1.12" />
              <feFuncG type="linear" slope="1.12" />
              <feFuncB type="linear" slope="1.12" />
            </feComponentTransfer>
          </filter>
        </svg>
        <div class="lab-port">
          <video
            id="lab-video"
            class="lab-video"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="auto"
            src="videos/portal.mov"
          ></video>
        </div>
        <img class="lab-panel" src="assets/game/Lab.png" alt="" draggable="false">
        <img class="lab-logo" src="assets/game/Logo.png" alt="" draggable="false">
        <img id="lab-light" class="lab-light" src="assets/game/Light.png" alt="" hidden>
        <img id="lab-gauge" class="lab-gauge" src="assets/game/Gauge.png" alt="">
        <button type="button" id="lab-knob" class="lab-knob" aria-label="Machine control">
          <img src="assets/game/Knob.png" alt="">
        </button>
      </div>
    </div>
  </div>

  <script src="site-access.js"></script>
  <script src="ambient.js"></script>
  <script src="script.js"></script>
  <script src="game.js?v=4"></script>
</body>
</html>
