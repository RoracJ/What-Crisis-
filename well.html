<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Crisis?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="well-config.css?v=17">
  <link rel="stylesheet" href="well.css?v=22">
  <link rel="stylesheet" href="game2.css?v=3">
  <link rel="stylesheet" href="game3.css?v=2">
  <link rel="preload" as="image" href="assets/well-coda.jpg">
  <link rel="preload" as="image" href="assets/Gallery.png">
</head>
<body>
  <svg class="well-filters" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <defs id="well-filter-defs"></defs>
  </svg>

  <div class="well-viewport" id="well-viewport">
    <div class="well-stage" id="well-stage">
      <img
        class="well-photo"
        src="assets/Jules Dad.jpg"
        alt=""
        width="2632"
        height="2178"
        decoding="async"
        draggable="false"
      />
      <div class="well-heads" id="well-heads"></div>
      <button type="button" class="well-dad" id="well-dad" aria-label="Julian's dad"></button>
    </div>
    <div class="well-reveal" id="well-reveal">
      <img
        class="well-reveal-image"
        src="assets/well-reveal.jpg"
        alt=""
        width="2339"
        height="3035"
        decoding="async"
        draggable="false"
      />
    </div>
    <div class="well-final" id="well-final">
      <div class="well-final-stage" id="well-final-stage">
        <img
          class="well-final-image"
          src="assets/well-final.jpg"
          alt=""
          width="1258"
          height="950"
          decoding="async"
          draggable="false"
        />
      </div>
    </div>
    <div class="well-coda" id="well-coda">
      <img
        class="well-coda-image"
        src="assets/well-coda.jpg"
        alt=""
        width="1970"
        height="2066"
        decoding="async"
        draggable="false"
      />
    </div>
    <p class="well-coda-text" id="well-coda-text">
      <span class="well-coda-line" id="well-coda-line-1">Sated yet???</span>
      <span class="well-coda-line" id="well-coda-line-2"><em>Hungry Ghost</em>???</span>
    </p>
    <div class="well-blackout" id="well-blackout"></div>
    <div class="well-object-end" id="well-object-end">
      <img
        class="well-object-end-space"
        src="assets/Gallery.png"
        alt=""
        width="1254"
        height="1254"
        decoding="async"
        draggable="false"
      />
      <button type="button" class="well-object-end-stage" id="well-object-end-home" aria-label="Return home">
        <div class="well-object-end-clip">
          <div class="well-object-end-film-inner">
            <video
              class="well-object-end-film"
              id="well-object-end-film"
              src="videos/portal.mp4?v=1"
              playsinline
              webkit-playsinline
              preload="auto"
            ></video>
          </div>
          <img
            class="well-object-end-shell"
            src="assets/game/Object.png"
            alt=""
            draggable="false"
          />
        </div>
      </button>
    </div>
  </div>

  <div id="crisis-game2" class="crisis-game2" aria-hidden="true" tabindex="-1">
    <canvas id="crisis-game2-canvas" class="crisis-game2-canvas"></canvas>
    <div id="crisis-game2-fire" class="crisis-game2-fire" aria-hidden="true"></div>
  </div>

  <div id="crisis-game3" class="crisis-game3" aria-hidden="true" tabindex="-1">
    <canvas id="crisis-game3-canvas" class="crisis-game3-canvas"></canvas>
  </div>

  <script src="site-access.js?v=3"></script>
  <script src="game2-config.js?v=21"></script>
  <script src="game2.js?v=28"></script>
  <script src="game3-config.js?v=6"></script>
  <script src="game3.js?v=9"></script>
  <script src="well.js?v=47"></script>
</body>
</html>
